# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# nice!nano and XIAO BLE targets use the nrf52840-nosd snippet, so ZMK still
# boots after RMK has been flashed. Both boards run the Adafruit nRF52
# bootloader. RMK overwrites the SoftDevice that the Adafruit
# bootloader ships with. Without a SoftDevice the bootloader starts the app at
# 0x1000, but a default ZMK build starts at 0x26000, so only a nosd build boots.
# A nosd build also boots on a board that still has its SoftDevice, because the
# UF2 overwrites it. So every nice!nano and XIAO build stays nosd from now on,
# until the bootloader is re-flashed together with its SoftDevice.
# The settings partition moves as well: flash settings_reset first, then re-pair.
#
---
include:
  # === KEYBOARD HALVES (STANDALONE MODE) ===
  # Left half acts as central, connects directly to host
  - board: nice_nano//zmk
    snippet: nrf52840-nosd
    shield: splitkb_aurora_corne_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    snippet: nrf52840-nosd
    shield: splitkb_aurora_corne_right nice_view_adapter nice_view

  # === KEYBOARD HALVES (DONGLE MODE) ===
  # Both halves are peripherals, connecting to the dongle
  - board: nice_nano//zmk
    snippet: nrf52840-nosd
    shield: splitkb_aurora_corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: splitkb_aurora_corne_left_peripheral-nice_nano

  # === XIAO BLE DONGLE ===
  # Named 'corne_dongle' to avoid prefix matching with keyboard config files
  - board: xiao_ble//zmk
    snippet: nrf52840-nosd
    shield: corne_dongle

  # === SETTINGS RESET ===
  - board: xiao_ble//zmk
    snippet: nrf52840-nosd
    shield: settings_reset
  - board: nice_nano//zmk
    snippet: nrf52840-nosd
    shield: settings_reset
